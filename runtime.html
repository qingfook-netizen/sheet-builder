<!doctype html>
<html><head><meta charset="utf-8"><title>Sheet Builder</title>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<script src="prompt.js?v=10"></script>
<script src="writer.js?v=10"></script>
<script src="tree.js?v=10"></script>
<script src="answers.js?v=10"></script>
<script src="bank.js?v=10"></script>
<script src="runtime.js?v=10"></script>
<style>
  :root { color-scheme: light; }
  body { margin: 0; padding: 16px; background: #ffffff; color: #1a1a1a; font: 13px/1.45 -apple-system, system-ui, sans-serif; }
  h2 { font-size: 15px; margin: 0 0 12px; }
  #msgbox { display: none; background: #fff4e5; border: 1px solid #f0b46a; border-radius: 6px; padding: 10px 12px; margin-bottom: 16px; white-space: pre-wrap; }
  #msgbox.ok { background: #eaf6ee; border-color: #8cc79f; }
  label { display: block; font-weight: 600; margin: 12px 0 4px; }
  input, textarea { width: 100%; box-sizing: border-box; padding: 6px; font: inherit; color: #1a1a1a; background: #fff; border: 1px solid #bbb; border-radius: 4px; }
  .hint { color: #666; margin: 4px 0 0; }
  .row { display: flex; gap: 8px; align-items: center; margin-top: 14px; }
  button { padding: 6px 14px; font: inherit; border-radius: 4px; border: 1px solid #bbb; background: #fff; color: #1a1a1a; cursor: pointer; }
  button.primary { background: #1d6f42; border-color: #1d6f42; color: #fff; }
  #saved { color: #1d6f42; }
</style>
</head><body>
<h2>Sheet Builder</h2>
<div id="msgbox"></div>
<label for="k">OpenRouter API key</label>
<input id="k" type="password" placeholder="sk-or-v1-..." autocomplete="off">
<p class="hint">Stored on this computer only.</p>
<label for="m">Model</label>
<input id="m" list="models">
<datalist id="models">
  <option value="anthropic/claude-opus-5.5"></option>
  <option value="anthropic/claude-sonnet-5.5"></option>
</datalist>
<label for="n">Standing notes (sent with every build)</label>
<textarea id="n" rows="3" placeholder="e.g. Currency RM. Dates DD/MM/YYYY."></textarea>
<div class="row"><button class="primary" id="save">Save</button><button id="close">Close</button><span id="saved"></span></div>
<p class="hint" style="margin-top:18px">Build: paste a screenshot, then Cmd+Option+B or Build from Screenshot. This pane only opens for Settings or a message.</p>
</body></html>
