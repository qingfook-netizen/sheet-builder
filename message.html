<!doctype html>
<html><head><meta charset="utf-8"><title>Sheet Builder</title>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
</head><body style="font:13px -apple-system,system-ui,sans-serif;padding:16px;color:#1a1a1a">
<p id="t" style="white-space:pre-wrap;margin:0 0 14px"></p>
<button id="ok" style="padding:6px 16px;font:inherit;background:#1d6f42;color:#fff;border:0;border-radius:4px">OK</button>
<script>
 document.getElementById("t").textContent = decodeURIComponent(location.hash.slice(1));
 Office.onReady(() => { document.getElementById("ok").onclick = () => Office.context.ui.messageParent("close"); });
</script>
</body></html>
