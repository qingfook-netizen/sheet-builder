<!doctype html>
<html><head><meta charset="utf-8"><title>Sheet Builder settings</title>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<style>
 body{font:13px -apple-system,system-ui,sans-serif;padding:16px;color:#1a1a1a;margin:0}
 label{display:block;font-weight:600;margin:12px 0 4px}
 input,textarea{width:100%;box-sizing:border-box;padding:6px;font:inherit;border:1px solid #bbb;border-radius:4px}
 p{color:#666;margin:4px 0 0}
 button{margin-top:14px;padding:6px 16px;font:inherit;background:#1d6f42;color:#fff;border:0;border-radius:4px;cursor:pointer}
 #msg{color:#c62828;margin-left:8px}
</style></head><body>
<label for="k">OpenRouter API key</label>
<input id="k" type="password" placeholder="sk-or-v1-..." autocomplete="off">
<p>Stored on this computer only.</p>
<label for="m">Model</label>
<input id="m" list="models">
<datalist id="models">
 <option value="anthropic/claude-opus-5.5"></option>
 <option value="anthropic/claude-sonnet-5.5"></option>
</datalist>
<label for="n">Standing notes (sent with every build)</label>
<textarea id="n" rows="3" placeholder="e.g. Currency RM. Dates DD/MM/YYYY."></textarea>
<button id="s">Save</button><span id="msg"></span>
<script>
 const $ = (id) => document.getElementById(id);
 let cur = {}; try { cur = JSON.parse(localStorage.getItem("sb-settings") || "{}"); } catch {}
 $("k").value = cur.apiKey || ""; $("m").value = cur.model || "anthropic/claude-opus-5.5"; $("n").value = cur.standing || "";
 Office.onReady(() => {
   $("s").onclick = () => {
     const apiKey = $("k").value.trim();
     if (apiKey && !apiKey.startsWith("sk-or-")) { $("msg").textContent = "Key must start with sk-or-"; return; }
     Office.context.ui.messageParent(JSON.stringify({ save: { apiKey, model: $("m").value.trim() || "anthropic/claude-opus-5.5", standing: $("n").value.trim() } }));
   };
 });
</script>
</body></html>
